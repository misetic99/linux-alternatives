name: CI

# Checks every pull request: validates the data, runs the tests and builds the
# site. Nothing is published from here and pushes to main do not trigger it.
# Releases are checked again by the Deploy workflow (version tags).

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
