name: Deploy

# Publishes the website and JSON API.
#   - push to main          -> GitHub Pages (continuous)
#   - tag v* (e.g. v0.3.0)  -> your own server over SSH + rsync (a release)
#   - manual run            -> both
# GitHub Pages one-time setup: Settings -> Pages -> Source: "GitHub Actions".
# Own server setup (off until the variable SELF_HOST_DEPLOY is "true"): docs/SELF_HOSTING.md

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  pages:
    name: GitHub Pages
    if: ${{ github.ref_type == 'branch' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

  server:
    name: Own server
    if: ${{ vars.SELF_HOST_DEPLOY == 'true' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Sync dist/ to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done

          # rsync --delete is destructive: refuse anything that is not a deep absolute path.
          case "$DEPLOY_PATH" in
            /*/*) ;;
            *) echo "::error::DEPLOY_PATH must be an absolute path with at least two segments"; exit 1 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -p ${DEPLOY_PORT:-22} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          rm -f ~/.ssh/id_deploy
