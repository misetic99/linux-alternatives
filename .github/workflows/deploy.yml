name: Deploy

# Builds and publishes the website and JSON API. Only version tags build.
# Pushes to main do not run this workflow.
#   - tag v* (e.g. v0.3.3)  -> GitHub Pages, and your own server if enabled
#   - manual run            -> same, from the ref you choose (use a tag)
# GitHub Pages one-time setup:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches and tags:
#      add the tag rule "v*" (the default only allows main, which would block tags).
# Own server setup (off until the variable SELF_HOST_DEPLOY is "true"): docs/SELF_HOSTING.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Build and upload happen in their own job on purpose. deploy-pages looks the
  # artifact up through the API, and right after an upload in the same job the
  # lookup can return nothing ("No artifacts named github-pages were found").
  # A separate job gives the artifact time to become visible.
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      # Best effort: a slow or unreachable third-party site must never block a release.
      # Without a report the health page simply shows no link snapshot.
      - name: Check source availability for the health page
        run: npm run check:links
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  pages:
    name: GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  server:
    name: Own server
    if: ${{ vars.SELF_HOST_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      # Best effort: a slow or unreachable third-party site must never block a release.
      # Without a report the health page simply shows no link snapshot.
      - name: Check source availability for the health page
        run: npm run check:links
        continue-on-error: true
        timeout-minutes: 15
      - run: npm run build

      - name: Sync dist/ to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done

          # rsync --delete is destructive: refuse anything that is not a deep absolute path.
          case "$DEPLOY_PATH" in
            /*/*) ;;
            *) echo "::error::DEPLOY_PATH must be an absolute path with at least two segments"; exit 1 ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_deploy -p ${DEPLOY_PORT:-22} -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

          rm -f ~/.ssh/id_deploy
