# License: https://github.com/xournalpp/xournalpp/blob/master/resources-templates/com.github.xournalpp.xournalpp.appdata.xml.in
# Package: https://flathub.org/en/apps/com.github.xournalpp.xournalpp
id: xournalpp
name: Xournal++
homepage: https://xournalpp.github.io/
license: GPL-2.0-only
description: Handwritten note editor with stylus input, PDF annotation and PDF export.
install:
  - method: apt
    ref: xournalpp
    sources:
      - https://packages.debian.org/trixie/xournalpp
    distros:
      - debian
    notes: Debian 13 (Trixie), main repository; availability can differ by release and architecture.
  - method: apt
    ref: xournalpp
    distros:
      - ubuntu
    sources:
      - https://packages.ubuntu.com/noble/xournalpp
    notes: Ubuntu 24.04 LTS (Noble), universe repository; enable Universe where indicated. Other releases and derivatives may differ.
  - method: apt
    ref: xournalpp
    distros:
      - linux-mint
    sources:
      - https://community.linuxmint.com/software/view/xournalpp
    notes: Listed in the Linux Mint software directory. Package versions and availability depend on the selected Mint release and configured repositories.
  - method: dnf
    ref: xournalpp
    sources:
      - https://packages.fedoraproject.org/pkgs/xournalpp/xournalpp/
    distros:
      - fedora
    notes: Fedora repositories; this does not imply availability in RHEL or its derivatives.
  - method: pacman
    ref: xournalpp
    distros:
      - arch
    sources:
      - https://archlinux.org/packages/extra/x86_64/xournalpp/
    notes: Official Arch Linux Extra repository, x86_64; derivatives may ship different versions.
  - method: zypper
    ref: xournalpp
    distros:
      - opensuse-tumbleweed
    sources:
      - https://download.opensuse.org/tumbleweed/repo/oss/repodata/repomd.xml
      - https://software.opensuse.org/package/xournalpp
    notes: openSUSE Tumbleweed OSS repository; this is not a claim about Leap releases.
  - method: apk
    ref: xournalpp
    distros:
      - alpine
    sources:
      - https://dl-cdn.alpinelinux.org/alpine/latest-stable/community/x86_64/APKINDEX.tar.gz
    notes: Alpine latest-stable, community repository, x86_64; enable this repository before installing.
  - method: nix
    ref: xournalpp
    distros:
      - nixos
    sources:
      - https://raw.githubusercontent.com/NixOS/nixpkgs/nixos-unstable/pkgs/by-name/xo/xournalpp/package.nix
    notes: nixpkgs unstable package expression. Requires Nix with nix-command and flakes enabled; the selected nixpkgs registry determines the version.
  - method: emerge
    ref: app-text/xournalpp
    distros:
      - gentoo
    sources:
      - https://packages.gentoo.org/packages/app-text/xournalpp
    notes: Gentoo package tree; architecture keywords, USE flags and unmasking requirements depend on your system.
  - method: xbps
    ref: xournalpp
    distros:
      - void
    sources:
      - https://raw.githubusercontent.com/void-linux/void-packages/master/srcpkgs/xournalpp/template
    notes: Void Linux package template. Binary availability, libc and architecture must match your configured repository.
  - method: eopkg
    ref: xournalpp
    distros:
      - solus
    sources:
      - https://packages.getsol.us/shannon/x/xournalpp/
    notes: Solus Shannon binary repository, x86_64.
  - method: snap
    ref: xournalpp
    distros:
      - ubuntu
      - debian
      - linux-mint
      - fedora
      - arch
      - manjaro
      - opensuse-tumbleweed
      - opensuse-leap
      - kde-neon
      - zorin
      - elementary
    sources:
      - https://snapcraft.io/xournalpp
      - https://snapcraft.io/docs/installing-snapd
    notes: Requires snapd and the Snap Store. Linux Mint and other distributions may require explicit Snap enablement.
  - method: flatpak
    ref: com.github.xournalpp.xournalpp
    distros:
      - any
    sources:
      - https://flathub.org/en/apps/com.github.xournalpp.xournalpp
      - https://flathub.org/en/setup
    notes: Requires Flatpak and the Flathub repository. This is a cross-distribution runtime option, not vendor certification or a guarantee for every architecture.
  - method: download
    ref: https://xournalpp.github.io/installation/linux/
    distros:
      - any
    sources:
      - https://xournalpp.github.io/installation/linux/
    notes: Official project downloads or installation instructions. Select a Linux package for your distribution and architecture; some projects provide source builds rather than universal binaries.
  - method: appimage
    ref: https://xournalpp.github.io/installation/linux/
    distros:
      - any
    sources:
      - https://xournalpp.github.io/installation/linux/
    notes: The project page lists AppImage builds. Check architecture, release requirements and FUSE support. This link opens the official page; it does not download or execute a file automatically.
