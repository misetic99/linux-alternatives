# License and package links: https://www.pinta-project.com/releases/
id: pinta
name: Pinta
homepage: https://www.pinta-project.com/
license: MIT
description: Drawing and image editor with selection tools, effects and adjustments.
install:
  - method: dnf
    ref: pinta
    sources:
      - https://packages.fedoraproject.org/pkgs/pinta/pinta/
    distros:
      - fedora
    notes: Fedora repositories; this does not imply availability in RHEL or its derivatives.
  - method: pacman
    ref: pinta
    distros:
      - arch
    sources:
      - https://archlinux.org/packages/extra/x86_64/pinta/
    notes: Official Arch Linux Extra repository, x86_64; derivatives may ship different versions.
  - method: zypper
    ref: pinta
    distros:
      - opensuse-tumbleweed
    sources:
      - https://download.opensuse.org/tumbleweed/repo/oss/repodata/repomd.xml
      - https://software.opensuse.org/package/pinta
    notes: openSUSE Tumbleweed OSS repository; this is not a claim about Leap releases.
  - method: apk
    ref: pinta
    distros:
      - alpine
    sources:
      - https://dl-cdn.alpinelinux.org/alpine/latest-stable/community/x86_64/APKINDEX.tar.gz
    notes: Alpine latest-stable, community repository, x86_64; enable this repository before installing.
  - method: nix
    ref: pinta
    distros:
      - nixos
    sources:
      - https://raw.githubusercontent.com/NixOS/nixpkgs/nixos-unstable/pkgs/by-name/pi/pinta/package.nix
    notes: nixpkgs unstable package expression. Requires Nix with nix-command and flakes enabled; the selected nixpkgs registry determines the version.
  - method: emerge
    ref: media-gfx/pinta
    distros:
      - gentoo
    sources:
      - https://packages.gentoo.org/packages/media-gfx/pinta
    notes: Gentoo package tree; architecture keywords, USE flags and unmasking requirements depend on your system.
  - method: eopkg
    ref: pinta
    distros:
      - solus
    sources:
      - https://packages.getsol.us/shannon/p/pinta/
    notes: Solus Shannon binary repository, x86_64.
  - method: snap
    ref: pinta
    distros:
      - ubuntu
      - debian
      - linux-mint
      - fedora
      - arch
      - manjaro
      - opensuse-tumbleweed
      - opensuse-leap
      - kde-neon
      - zorin
      - elementary
    sources:
      - https://snapcraft.io/pinta
      - https://snapcraft.io/docs/installing-snapd
    notes: Requires snapd and the Snap Store. Linux Mint and other distributions may require explicit Snap enablement.
  - method: flatpak
    ref: com.github.PintaProject.Pinta
    distros:
      - any
    sources:
      - https://flathub.org/en/apps/com.github.PintaProject.Pinta
      - https://flathub.org/en/setup
    notes: Requires Flatpak and the Flathub repository. This is a cross-distribution runtime option, not vendor certification or a guarantee for every architecture.
  - method: download
    ref: https://www.pinta-project.com/releases/
    distros:
      - any
    sources:
      - https://www.pinta-project.com/releases/
    notes: Official project downloads or installation instructions. Select a Linux package for your distribution and architecture; some projects provide source builds rather than universal binaries.
  - method: appimage
    ref: https://www.pinta-project.com/releases/
    distros:
      - any
    sources:
      - https://www.pinta-project.com/releases/
    notes: The project page links to a community-maintained AppImage. The Pinta project does not officially support that package. Check architecture and FUSE requirements.
