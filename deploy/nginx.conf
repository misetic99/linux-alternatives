# nginx server block for linux-alternatives.itasel.org (static files only).
# TLS is terminated in front of this (Caddy, host nginx, Traefik, ...), or add
# your own `listen 443 ssl` + certificates if you serve it directly.
#
# Docker: copied to /etc/nginx/conf.d/default.conf.
# Bare server: put it in /etc/nginx/conf.d/, set `root` to your deploy path.

server {
    listen 80;
    listen [::]:80;
    server_name linux-alternatives.itasel.org;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    # Only static files are served: no PHP, no uploads, no directory listings.
    autoindex off;
    location ~ /\. { deny all; }

    error_page 404 /404.html;

    # The website. Revalidate often so a new deploy shows up quickly.
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # Self-hosted font: changes rarely, safe to cache for a month.
    location /fonts/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Public JSON API: open to any origin so other tools can use it from the browser.
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=300" always;
        limit_except GET HEAD OPTIONS { deny all; }
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
