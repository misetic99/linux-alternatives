# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Listens on 127.0.0.1:8080 only. Put a TLS reverse proxy in front of it
# (see docs/SELF_HOSTING.md).
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://linux-alternatives.itasel.org}
    image: linux-alternatives:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
